<div class='s-head'><span class='eyebrow'><i class='ri-armor-line'></i>07 / ARSENAL</span><h2 class='s-title'>武器与铠甲：实战的武装配置</h2><div class='s-sub'>They were armed, not merely posed</div></div><div class='s-body'><div class='two-col'><div class='col-box'><div class='col-head'><i class='ri-sword-line'></i><h4>冷兵器阵列</h4><span class='tag'>已出土 4 万+</span></div><div class='col-list'><div class='col-li'><span class='num'>1</span><div class='tx'><b>青铜剑</b>：长约 86 厘米，锋利异常，表面经铬盐钝化，至今仍寒光不锈。</div></div><div class='col-li'><span class='num'>2</span><div class='tx'><b>弩机</b>：标准化青铜悬刀，零件可互换，是早期批量生产的工艺典范。</div></div><div class='col-li'><span class='num'>3</span><div class='tx'><b>铍与矛</b>：长柄刺兵，配合方阵前突，铜镞至今可视菱形三刃。</div></div></div></div><div class='col-box'><div class='col-head'><i class='ri-shield-line'></i><h4>甲与服饰</h4><span class='tag'>甲片 · 涤纶 · 彩绘</span></div><div class='col-list'><div class='col-li'><span class='num'>4</span><div class='tx'><b>札甲</b>：胸背腰分片以皮条连缀，作战兼顾防护与灵活。</div></div><div class='col-li'><span class='num'>5</span><div class='tx'><b>战袍</b>：长襦束带，发髻以巾束起，武士结赤帻，将军戴鹖冠。</div></div><div class='col-li'><span class='num'>6</span><div class='tx'><b>战靴</b>：方口圆头，底有防滑雷纹，已是成熟军用鞋样。</div></div></div></div></div></div>
