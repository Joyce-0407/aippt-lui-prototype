<div class='finale'><div class='finale-l'><i class='ri-shield-star-line seal'></i><h2>地下不动<br>已成永恒</h2><div style='font-size:20px;line-height:1.8;color:var(--bone-soft)'>两千两百年的陶土与烈火，结成八千张面容。<br>他们不为帝王一人立，<br>而是为整个秦的影像，凝固为一座时间的城。</div><div class='tag-row'><span>世界文化遗产</span><span>第八奇迹</span><span>国家一级文物</span></div></div><div class='finale-r'><div class='lead'>两千两百年，他们没有后退一步。<br>我们站在此刻，<br>只为了静静，看见一个帝国的呼吸。</div><div class='sign'>— 西安 · 秦始皇帝陵博物院</div></div></div>
