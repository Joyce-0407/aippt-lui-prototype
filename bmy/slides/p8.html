<div class='s-head'><span class='eyebrow'><i class='ri-aura-line'></i>08 / INDIVIDUALITY</span><h2 class='s-title'>「视之若一一皆活」</h2><div class='s-sub'>Every face a different man</div></div><div class='s-body'><div class='split'><div class='split-l'><div class='lead'>每一个陶俑，都带着独自的眉骨与下颌。</div><p>考古调查确认：出土陶俑的面型大致归为八类，关中、巴蜀、陇东、齐鲁的不同方相，被匠人按籍贯分类塑造。它不是规格化的复制，而是一个时代的肖像博物馆。</p><div class='quote'>「千人千面，千面千心。」 —— 陕西考古研究院</div></div><div class='split-r'><div class='face-card'><i class='ri-vidicon-line'></i><div class='n'>8</div><div class='t'>面型分类</div><div class='d'>目、甲、申、由、田、风、用、国</div></div><div class='face-card'><i class='ri-hair-2-line'></i><div class='n'>20+</div><div class='t'>发髻样式</div><div class='d'>圆髻、扁髻、单股双股各异</div></div><div class='face-card'><i class='ri-user-smile-line'></i><div class='n'>180+</div><div class='t'>俑头复原</div><div class='d'>每件面部特征皆不重复</div></div><div class='face-card'><i class='ri-vidicon-2-line'></i><div class='n'>11</div><div class='t'>军阶俑型</div><div class='d'>将军、中郎、武士、御手等</div></div></div></div></div>
