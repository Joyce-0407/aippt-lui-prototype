<div class='s-head'><span class='eyebrow'><i class='ri-tools-line'></i>06 / CRAFTSMANSHIP</span><h2 class='s-title'>塑模合烧：陶俑成器四道工序</h2><div class='s-sub'>From clay to warrior</div></div><div class='s-body'><div class='steps'><div class='step'><div class='ord'>01</div><i class='ri-ancient-pavilion-line ico'></i><h4>塑形</h4><p>以泥条盘筑与模塑结合塑出头、手、躯干，再贴合拼装，预留接合接口。</p></div><div class='step'><div class='ord'>02</div><i class='ri-contrast-2-line ico'></i><h4>细刻</h4><p>刻画五官、须发、甲胄与服饰褶皱，令千俑千相。</p></div><div class='step'><div class='ord'>03</div><i class='ri-fire-line ico'></i><h4>烧制</h4><p>入窑约 950–1000℃ 低温烧结，型体致密而不变形。</p></div><div class='step'><div class='ord'>04</div><i class='ri-palette-line ico'></i><h4>彩绘</h4><p>出窑后以生漆打底再施彩料，孔雀石、朱砂、骨白敷色鲜艳。</p></div></div></div>
