<div class='s-head'><span class='eyebrow'><i class='ri-shield-flash-line'></i>09 / PRESERVATION</span><h2 class='s-title'>遗址之上的博物馆</h2><div class='s-sub'>Built over the pit, not away from it</div></div><div class='s-body'><div class='prot-grid'><div class='prot-card'><i class='ri-building-2-line'></i><div><h4>大棚盖覆</h4><p>1979 年一号坑遗址大厅建成，跨度 72 米的钢拱罩直接覆盖土坑，让游客俯视军阵原貌。</p></div></div><div class='prot-card'><i class='ri-palette-line'></i><div><h4>彩绘剥离保护</h4><p>新出土彩绘易在分钟内卷曲失效，文物局采用 PEG 与单体加固法延缓彩层剥落。</p></div></div><div class='prot-card'><i class='ri-scan-2-line'></i><div><h4>数字化扫描</h4><p>对每一件陶俑高精度三维扫描建档，建立永久数字副本，便于全息展示与远程研究。</p></div></div><div class='prot-card'><i class='ri-museum-line'></i><div><h4>秦始皇帝陵博物院</h4><p>2009 年组建，统管兵马俑坑与丽山园，年接待逾 1200 万观众，居国内文博馆之首。</p></div></div></div></div>
